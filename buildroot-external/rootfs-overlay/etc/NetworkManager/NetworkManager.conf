[main]
# This recovery image has no systemd-resolved, so let NetworkManager write
# /etc/resolv.conf itself from the DHCP-provided servers.
dns=default
# Use NetworkManager's built-in DHCP client (no dhclient/dhcpcd in the image).
dhcp=internal
# Store connection profiles as keyfiles under
# /etc/NetworkManager/system-connections/*.nmconnection.
# NOTE: the rootfs is a RAM initramfs, so saved Wi-Fi profiles do NOT persist
# across reboots; this is expected for recovery.
plugins=keyfile

[connection-wifi]
match-device=type:wifi
# Fail DHCP fast during Wi-Fi provisioning. NM's 45s default is >= the app's own
# nmcli wait, so a router that never answers surfaces as a bare "timeout" while
# the setup-AP is still down. 15s puts the verdict inside the window, so the
# portal can say "the router gave no address" instead of guessing.
ipv4.dhcp-timeout=15

[device]
# Drive the Wi-Fi radio through wpa_supplicant over D-Bus.
wifi.backend=wpa_supplicant

[logging]
level=INFO
domains=ALL
