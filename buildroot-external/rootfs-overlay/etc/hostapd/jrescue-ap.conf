# JetHub recovery setup-AP (hostapd). The `interface=` line is prepended at
# runtime by /usr/bin/jrescue-ap-up (Wi-Fi device name is auto-detected).
#
# Credentials for the setup AP. NOTE: WPA2 passphrase must be 8..63 chars —
# "jethub" (6) is too short, so the PSK is padded. Change SSID/PSK here.
ssid=jethub
wpa_passphrase=jethub123

driver=nl80211
# 2.4 GHz, channel 1 — best phone compatibility, avoids 5 GHz/DFS refusals.
hw_mode=g
channel=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
ignore_broadcast_ssid=0

