# JetHub recovery mDNS responder. Publishes a fixed <jethub.local> name so a
# phone can reach the device after the setup-AP hands the radio over to the home
# Wi-Fi (the device's new DHCP IP is otherwise unknown to the phone).
#
# host-name is fixed to "jethub" (not the per-board hostname) so the URL the
# user is told — http://jethub.local:8124 — is the same on every board. If two
# devices are provisioned at once, avahi auto-suffixes (jethub-2.local).
[server]
host-name=jethub
use-ipv4=yes
use-ipv6=no
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[publish]
publish-hostinfo=yes
publish-workstation=no

[rlimits]
rlimit-nproc=3
