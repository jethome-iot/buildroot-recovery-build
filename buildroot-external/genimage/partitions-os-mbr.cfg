partition hassos-boot {
	size = ${BOOT_SIZE}
	partition-type = 0xc
	bootable = "yes"
	image = "boot.vfat"
}

partition hassos-kernel0 {
    partition-type = 0x83
    size = ${KERNEL_SIZE}
    image = "${BINARIES_DIR}/kernel.ext4"
}


partition hassos-system0 {
	partition-type = 0x83
	size = ${SYSTEM_SIZE}
	image = ${SYSTEM_IMAGE}
}

partition hassos-bootstate {
	partition-type = 0x83
	size = ${BOOTSTATE_SIZE}
}
