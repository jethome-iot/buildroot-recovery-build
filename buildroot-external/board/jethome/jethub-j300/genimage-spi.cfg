image spi-nor.img {
    size = 64M

    hdimage {
        partition-table-type = "none"
    }

    partition uboot {
        in-partition-table = "no"
        image = "${BINARIES_DIR}/u-boot.bin"
        offset = 0x00000000
        size = 0x00400000
    }

    partition env {
        in-partition-table = "no"
        image = "${BINARIES_DIR}/env.blank"
        offset = 0x00400000
        size = 0x00010000
    }

    partition kernel {
        in-partition-table = "no"
        image = "${BINARIES_DIR}/Image.lzma"
        offset = 0x00410000
        size = 0x03BF0000
    }
}