[system]
compatible=jethub-j300-recovery
bootloader=custom
variant-name=recovery

statusfile=/tmp/rauc.status

[handlers]
bootloader-custom-backend=/usr/libexec/rauc-bootloader-backend

[slot.recovery.0]
device=/dev/loop-recovery-a
type=raw
bootname=A

[slot.recovery.1]
device=/dev/loop-recovery-b
type=raw
bootname=B
