image boot.vfat {
    vfat {
        files = {
            "${BINARIES_DIR}/Image.lzma",
            "${BINARIES_DIR}/meson-s7d-jethub-j300.dtb"
        }
    }
    size = 80M
}

image rescue.img {
    size = 256M

    hdimage {
        partition-table-type = "mbr"
    }

    partition uboot {
        in-partition-table = "no"
        offset = 0
        size = 4M
        image = "${BINARIES_DIR}/u-boot.bin.sd.bin"
        holes = { "(440; 512)" }
    }

    partition boot {
        partition-type = 0x0c
        bootable = true
        image = "boot.vfat"
        size = 80M
    }

    partition rootfs {
        partition-type = 0x83
        image = "${BINARIES_DIR}/rootfs.erofs"
        size = 168M
    }
}
