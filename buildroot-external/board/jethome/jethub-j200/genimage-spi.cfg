image spi-nor.img {
    size = 31M

    hdimage {
        partition-table-type = "none"
    }

    partition uboot {
        in-partition-table = "no"
        image = "${BINARIES_DIR}/u-boot.bin"
        offset = 0x00000000
        size = 2M
    }

    partition env {
        in-partition-table = "no"
        image = "${BINARIES_DIR}/env.blank"
        offset = 0x00200000
        size = 64K
    }

    partition kernel {
        in-partition-table = "no"
        image = "${BINARIES_DIR}/Image.lzma"
        offset = 0x00210000
        size = 0x005F0000
    }

    partition version {
    in-partition-table = "no"
    image = "${BINARIES_DIR}/version-header.bin"
    offset = 0x00800000
    size = 64K
    }

    partition rootfs {
        in-partition-table = "no"
        image = "${BINARIES_DIR}/rootfs.erofs"
        offset = 0x00810000
        size = 19M
    }
}