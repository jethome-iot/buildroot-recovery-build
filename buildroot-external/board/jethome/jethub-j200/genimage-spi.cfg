image spi-nor.img {
    size = 32M

    hdimage {
        partition-table-type = "none"
    }

    partition uboot {
        in-partition-table = "no"
        image = "${BINARIES_DIR}/u-boot.bin"
        offset = 0x00000000
        size = 2M
    }

    partition kernel {
        in-partition-table = "no"
        image = "${BINARIES_DIR}/Image.lzma"
        offset = 0x00200000
        size = 6M
    }

    partition rootfs {
        in-partition-table = "no"
        image = "${BINARIES_DIR}/rootfs.erofs"
        offset = 0x00800000
        size = 24M
    }
}