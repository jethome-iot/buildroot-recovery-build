image sdimage.img {
    size = 30M

    hdimage {
        partition-table-type = "mbr"
        disk-signature = 0x48617373
    }

    partition uboot {
        in-partition-table = "no"
        offset = 0
        size = 2M
        image = "u-boot.bin.sd.bin"
        holes = {"(440; 512)"}
    }

    partition spi-nor {
        partition-type = 0x83
        image = "${BINARIES_DIR}/spiimage.ext4"
        size = 27M
    }
}



