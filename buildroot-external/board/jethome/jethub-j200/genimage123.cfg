image spi-flash.img {
    size = 32M


    partition uboot {
        size = ${BOOT_SPL_SIZE}
        image = "u-boot.bin.sd.bin"
        offset = 0
    }

	partition env {
        offset = 0x00200000
    	size = 128K
	}

	partition kernel {
        image = ${KERNEL_FILE}
        offset = 0x001A0000
        size = 6M
    }

	partition os-system {
		image = ${BINARIES_DIR}/rootfs.erofs.lzma
        offset = 0x007A0000
		size = ${SYSTEM_SIZE}
	}
}

image "${IMAGE_NAME}.raucb" {
    rauc {
        key = "/build/key.pem"
        cert = "/build/cert.pem"
        keyring = "${TARGET_DIR}/etc/rauc/keyring.pem"
        manifest = "${RAUC_MANIFEST:-PLEASE_SPECIFY_RAUC_MANIFEST}"
        file hook { image = "${BR2_EXTERNAL_JHOS_PATH}/ota/rauc-hook" }
        file uboot { image = "${BINARIES_DIR}/u-boot.bin.sd.bin" }
        file rootfs.img { image = ${SYSTEM_IMAGE} }
    }
}