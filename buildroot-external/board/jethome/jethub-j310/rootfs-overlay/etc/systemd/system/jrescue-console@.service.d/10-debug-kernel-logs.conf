# DEBUG (j310 bring-up): the shared console unit lowers the kernel console to
# printk=1 (only KERN_EMERG) so the kiosk stays clean. This drop-in runs after
# it and raises the console back to 7 (info and above), so kernel messages keep
# printing over the UI while debugging. Delete this file to restore the quiet
# kiosk console on j310.
[Service]
ExecStartPre=-/bin/sh -c 'echo 7 > /proc/sys/kernel/printk'
